name: tingjian

x-runtime: &runtime
  image: tingjian:local
  build:
    context: .
    target: runtime
  env_file: .env
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *runtime
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: ${APP_MEMORY:-12g}
    volumes:
      - ./models:/models:ro
    # Deliberately NO host port mapping. Only Caddy may reach app:8000.
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 20s
      timeout: 8s
      start_period: 180s
      retries: 5
    stop_grace_period: 35s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Run scripts/configure.py first}
      ACME_EMAIL: ${ACME_EMAIL:?Set your certificate contact email}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy

  tools:
    <<: *runtime
    profiles: [tools]
    user: "0:0"
    mem_limit: ${APP_MEMORY:-12g}
    volumes:
      - ./models:/models
    command: ["python", "scripts/self_test.py"]

volumes:
  caddy_data:
  caddy_config:
